name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
      # Ensure we publish the Vite build (hashed assets), never the repo-root source HTML.
      - name: Verify Vite build artifact
        run: |
          set -euo pipefail
          test -f docs/index.html
          test -d docs/assets
          if grep -q '%BASE_URL%' docs/index.html; then
            echo "::error::Built index.html still contains literal %BASE_URL%"
            exit 1
          fi
          if grep -q '/src/main.tsx' docs/index.html; then
            echo "::error::Built index.html still references /src/main.tsx (source HTML, not Vite output)"
            exit 1
          fi
          if ! grep -Eq 'assets/.*\.(js|css)' docs/index.html; then
            echo "::error::Built index.html has no hashed assets/ references"
            exit 1
          fi
          echo "Build artifact OK:"
          head -n 20 docs/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          # Vite outDir (see vite.config.ts) — not the repository root
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
